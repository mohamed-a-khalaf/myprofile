<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        :root {
            /* Page */
            --page-bg: #F3F4F6;
            --text: #374151;
            --white: #FFFFFF;

            /* Navy (header, footer, h2 text) */
            --navy: #1E3A5F;
            --navy-dark: #16304F;
            --header-subtext: #DBEAFE;

            /* Main content */
            --main-border: #D1D5DB;
            --heading-bg: #E8EEF5;
            --heading-border: #CBD5E1;
            --paragraph-text: #4B5563;
            --paragraph-border: #E5E7EB;

            /* Skills */
            --skills-text: #166534;
            --skills-bg: #DCFCE7;
            --skills-border: #BBF7D0;

            /* Goals */
            --goals-text: #7C2D12;
            --goals-bg: #FFF7ED;
            --goals-border: #FED7AA;

            /* Font sizes */
            --font-small: 14px;
            --font-base: 16px;
            --font-h2: 22px;
            --font-h1: 32px;

            /* Spacing */
            --space-xs: 8px;
            --space-sm: 10px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text);
            font-size: var(--font-base);
            margin: 0px;
        }

        header {
            background-color: var(--navy);
            color: var(--white);
            font-size: var(--font-base);
            padding: var(--space-2xl);
            border: 2px solid var(--navy-dark);

            h1 {
                color: var(--white);
                font-size: var(--font-h1);
                margin: 0px;
            }

            p {
                color: var(--header-subtext);
                font-size: var(--font-base);
                margin: var(--space-md) auto;
            }
        }

        main {
            background-color: var(--white);
            color: var(--text);
            padding: var(--space-xl);
            border: 1px solid var(--main-border);
            margin: var(--space-lg);

            h2 {
                color: var(--navy);
                background-color: var(--heading-bg);
                font-size: var(--font-h2);
                padding: var(--space-md);
                border: 1px solid var(--heading-border);
                margin: var(--space-xl) auto;
            }

            p {
                color: var(--paragraph-text);
                font-size: var(--font-base);
                padding: var(--space-xs);
                border: 1px solid var(--paragraph-border);
                margin: var(--space-sm) auto;
            }

            section:nth-of-type(2) p {
                color: var(--skills-text);
                background-color: var(--skills-bg);
                font-size: var(--font-base);
                padding: var(--space-md);
                border: 1px solid var(--skills-border);
                margin: var(--space-sm) auto;
            }

            section:nth-of-type(3) {
                background-color: var(--goals-bg);
                color: var(--goals-text);
                padding: var(--space-md);
                border: 1px solid var(--goals-border);
                margin: var(--space-xl) auto;
            }
        }

        footer {
            background-color: var(--navy);
            color: var(--white);
            font-size: var(--font-small);
            padding: var(--space-lg);
            border: 1px solid var(--navy-dark);
            margin: var(--space-xl);
        }
    </style>
</head>

<body>

    <header>
        <h1>My Profile</h1>
        <p>Welcome to my personal page!</p>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>
                Hello! My name is Alex. I am learning web development
                and I enjoy creating simple and beautiful websites.
            </p>
        </section>

        <section>
            <h2>My Skills</h2>
            <p>HTML</p>
            <p>CSS</p>
            <p>JavaScript</p>
        </section>

        <section>
            <h2>My Goals</h2>
            <p>Learn CSS</p>
            <p>Build beautiful websites</p>
            <p>Become a web developer</p>
        </section>

    </main>

    <footer>
        <p>Created by Alex - 2026</p>
    </footer>


</body>

</html>
